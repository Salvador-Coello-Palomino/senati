<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/estilo.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</head>

<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"> Mi Sitio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="#"> <i class="bi bi-house me-2"></i> Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-person-circle me-2"></i>Nosotros</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-play-btn me-2"></i>Cines</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Promociones</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#exampleModal">Dulcería</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Películas
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#">Acción</a></li>
                            <li><a class="dropdown-item" href="#"> Comedia</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Ficción</a></li>
                        </ul>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <main>
        <section>
            <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="img/1.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="img/2.jpg" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="img/3.jpg" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>

        <section class="container">
            <h3 class="text-center mb-4">Películas</h3>
            <div class="row g-4 galeria">

                <div class="col-12 col-sm-6 col-lg-4">
                    <img src="img/peli1 (1).jpg" class="img-fluid rounded" alt="">
                </div>

                <div class="col-12 col-sm-6 col-lg-4">
                    <img src="img/peli1 (2).jpg" class="img-fluid rounded" alt="">
                </div>

                <div class="col-12 col-sm-6 col-lg-4">
                    <img src="img/peli1 (3).jpg" class="img-fluid rounded" alt="">
                </div>

                <div class="col-12 col-sm-6 col-lg-4">
                    <img src="img/peli1 (4).jpg" class="img-fluid rounded" alt="">
                </div>


                <div class="col-12 col-sm-6 col-lg-4">
                    <img src="img/peli1 (5).jpg" class="img-fluid rounded" alt="">
                </div>

            </div>

        </section>





        <!-- VENTANA MODAL -->

        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-xl">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Registro de Dulces</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">

                        <div class="row">
                            <div class="col">
                                <input type="text" placeholder="Código" class="form-control">
                            </div>

                            <div class="col">
                                <input type="text" placeholder="Nombre del dulce" class="form-control">
                            </div>

                            <div class="col-auto">
                                <input type="text" placeholder="Cantidad" class="form-control">
                            </div>
                        </div>

                        <div style="padding: 20px;">

                            <button type="button" class="btn btn-primary">Guardar</button>
                            <button type="button" class="btn btn-secondary">Actualizar</button>
                            <button type="button" class="btn btn-success">Eliminar</button>
                        </div>

                        <div>
                            <table class="table table-dark table-hover">
                                <thead>
                                    <tr>
                                        <th scope="col">#</th>
                                        <th scope="col">First</th>
                                        <th scope="col">Last</th>
                                        <th scope="col">Handle</th>
                                        <th scope="col">Acciones</th>

                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <th scope="row">1</th>
                                        <td>Mark</td>
                                        <td>Otto</td>
                                        <td>@mdo</td>
                                        <td>

                                            <button class="btn btn-primary" onclick="mostrarAlerta()"><i
                                                    class="bi bi-trash me-2"></i>Eliminar</button>
                                            <button class="btn btn-danger"><i
                                                    class="bi bi-arrow-clockwise me-2"></i>Actualizar</button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th scope="row">2</th>
                                        <td>Jacob</td>
                                        <td>Thornton</td>
                                        <td>@fat</td>
                                        <td>
                                            <i class="bi bi-trash"></i>
                                            <i class="bi bi-arrow-clockwise"></i>
                                        </td>
                                    </tr>
                                    <tr>
                                        <th scope="row">3</th>
                                        <td>John</td>
                                        <td>Doe</td>
                                        <td>@social</td>
                                        <td>
                                            <i class="bi bi-trash"></i>
                                            <i class="bi bi-arrow-clockwise"></i>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>



                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="button" class="btn btn-primary">Save changes</button>
                    </div>
                </div>
            </div>
        </div>


    </main>



    <script>
        function mostrarAlerta() {
            Swal.fire({
                title: "Deseas Eliminar el dulce?",
                icon: "warning",
                showCancelButton: true,
                confirmButtonColor: "#3085d6",
                cancelButtonColor: "#d33",
                confirmButtonText: "Si"
            }).then((result) => {
                if (result.isConfirmed) Swal.fire({
                    title: "Eliminado!",
                    text: "El dulce ha sido eliminado",
                    icon: "success"
                });
            });
        }
    </script>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
